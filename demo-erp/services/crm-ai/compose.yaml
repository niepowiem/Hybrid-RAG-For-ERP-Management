services:
  classifier:
    build:
      context: .
    image: mailbinarycls-ai/classifier:1.2
    container_name: mailbinarycls-classifier
    restart: unless-stopped
    init: true
    gpus: all
    env_file:
      - ../classifier.env
    ports:
      - "${CRM_BIND_ADDRESS:-127.0.0.1}:8101:8101"
    volumes:
      - ../models:/models:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s